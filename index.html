<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Binso & Akhila</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero / Cover Section -->
    <header class="hero-section">
        <h1 id="guest-name">Welcome</h1>
        <div class="couple-names">Binso & Akhila</div>
        <p class="date">Wednesday · 07 April 2027</p>
        <button onclick="revealInvitation()">Tap to Open</button>
    </header>

    <!-- Main Content (Hidden until opened) -->
    <main id="main-invitation" class="hidden">
        
        <!-- Countdown Timer -->
        <section class="countdown-section">
            <h2>The Day Draws Closer</h2>
            <div id="timer">
                <span id="days">00</span> Days 
                <span id="hours">00</span> Hours 
                <span id="minutes">00</span> Mins
            </div>
        </section>

        <!-- Event Details -->
        <section class="event-details">
            <h2>Wedding Ceremony</h2>
            <p><strong>Time:</strong> Time 11:00 AM </p>
            <p><strong>Venue:</strong> Kottarakara Jubilee Mandiram, Kottarakara, Kerala</p>
            <a href="https://google.com" target="_blank" class="btn">Open in Google Maps</a>
        </section>

        <!-- Photo Gallery -->
        <section class="gallery-section">
            <h2>Our Moments</h2>
            <div class="gallery">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.20%20PM%20(1).jpeg" alt="Wedding moment 1">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.20%20PM%20(2).jpeg" alt="Wedding moment 2">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.20%20PM.jpeg" alt="Wedding moment 3">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.21%20PM%20(1).jpeg" alt="Wedding moment 4">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.21%20PM%20(2).jpeg" alt="Wedding moment 5">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.21%20PM.jpeg" alt="Wedding moment 6">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.22%20PM%20(1).jpeg" alt="Wedding moment 7">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.22%20PM.jpeg" alt="Wedding moment 8">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.23%20PM%20(1).jpeg" alt="Wedding moment 9">
                <img src="WhatsApp%20Image%202026-09-13%20at%2010.57.23%20PM.jpeg" alt="Wedding moment 10">
            </div>
        </section>

        <!-- Personalised Link Generator for WhatsApp -->
        <section class="generator-section">
            <h2>Create a Guest Link</h2>
            <input type="text" id="nameInput" placeholder="Enter Guest Name">
            <button onclick="generateLink()">Generate Link</button>
            <p id="generatedUrl"></p>
        </section>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
